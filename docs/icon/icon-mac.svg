<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- macOS icon grid: 824x824 rounded-square body centred on a 1024 canvas, with the system-style drop shadow.
       Same artwork as icon.svg (the iOS icon), scaled into the body. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B5BD7"/>
      <stop offset="1" stop-color="#173A8F"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF0FB"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0B1F4F" flood-opacity="0.45"/>
    </filter>
  
    <filter id="bodyShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="body">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#bodyShadow)"/>
  <g clip-path="url(#body)">
    <g transform="translate(100 100) scale(0.8046875)">

  <!-- page -->
  <rect x="232" y="176" width="560" height="672" rx="56" fill="url(#page)" filter="url(#shadow)"/>
  <!-- date tab -->
  <rect x="232" y="176" width="560" height="120" rx="56" fill="#1E4BC0"/>
  <rect x="232" y="240" width="560" height="56" fill="#1E4BC0"/>
  <circle cx="352" cy="176" r="30" fill="#0F2E7A"/>
  <circle cx="672" cy="176" r="30" fill="#0F2E7A"/>
  <rect x="332" y="120" width="40" height="112" rx="20" fill="#D9E3F7"/>
  <rect x="652" y="120" width="40" height="112" rx="20" fill="#D9E3F7"/>
  <!-- done lines -->
  <g stroke="#7A8DB5" stroke-width="26" stroke-linecap="round">
    <line x1="410" y1="392" x2="712" y2="392"/>
    <line x1="410" y1="500" x2="660" y2="500"/>
    <line x1="410" y1="608" x2="700" y2="608"/>
    <line x1="410" y1="716" x2="600" y2="716"/>
  </g>
  <!-- ticked boxes -->
  <g fill="#2B5BD7">
    <circle cx="330" cy="392" r="42"/>
    <circle cx="330" cy="500" r="42"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <path d="M310 394 l14 14 l28 -32"/>
    <path d="M310 502 l14 14 l28 -32"/>
  </g>
  <!-- open boxes -->
  <g fill="none" stroke="#9FB0D6" stroke-width="18">
    <circle cx="330" cy="608" r="34"/>
    <circle cx="330" cy="716" r="34"/>
  </g>
  <!-- accent: big check badge -->
  <circle cx="742" cy="778" r="118" fill="#34C759" stroke="#FFFFFF" stroke-width="26"/>
  <path d="M686 780 l40 40 l78 -88" fill="none" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#gloss)"/>
  </g>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2"/>
</svg>
