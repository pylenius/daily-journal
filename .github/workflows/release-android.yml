name: Release Android app
# Push a tag like `android-v0.1.0` to build a signed APK and attach it to a GitHub Release.
# Needs the repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and
# ANDROID_KEY_PASSWORD (see README, "Android app").
on:
  push:
    tags: ["android-v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#android-v}"
          if ! [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag must look like android-v1.2.3, got $GITHUB_REF_NAME"; exit 1
          fi
          # 1.2.3 -> 10203: increases with every release as long as minor and patch stay below 100.
          code=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The ANDROID_KEYSTORE_BASE64 secret is not set; an unsigned APK cannot be installed."; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/journal-release.jks"
      - name: JournalCore tests
        run: cd android && ./gradlew :journalcore:test
      - name: Build signed APK
        env:
          JOURNAL_KEYSTORE: ${{ runner.temp }}/journal-release.jks
          JOURNAL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          JOURNAL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          JOURNAL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew :app:assembleRelease -PversionName=${{ steps.version.outputs.name }} -PversionCode=${{ steps.version.outputs.code }}
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo "::error::No signed APK was produced"; ls app/build/outputs/apk/release; exit 1; }
          "$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner" verify --print-certs "$apk" | head -3
          mkdir -p out && cp "$apk" "out/Journal-${{ steps.version.outputs.name }}.apk"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.name }}"
          cat > notes.md <<EOF
          **Journal for Android $version**, the daily-journal reader for Android 10 and newer.

          - **Journal-$version.apk**: download it on the phone and open it. Android asks once to allow installing apps from your browser or file manager.

          On first launch, choose the journal folder. It has to be a real folder on the phone that a sync app keeps up to date with the Mac (Syncthing, FolderSync, Autosync for Google Drive / OneDrive / Dropbox); see the README.

          Updates install over the previous version as long as they are signed with the same key.
          EOF
          gh release create "$GITHUB_REF_NAME" "android/out/Journal-$version.apk" --title "Journal for Android $version" --notes-file notes.md
