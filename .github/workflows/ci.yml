name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 -m py_compile plugin/skills/daily-journal/scripts/*.py
      - run: bash -n plugin/skills/daily-journal/scripts/open-actions.sh
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.0.app || sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: JournalKit tests
        run: swift test --package-path ios/Packages/JournalKit
      - name: Generate project
        run: brew install xcodegen && cd ios && cp Signing.xcconfig.example Signing.xcconfig && xcodegen generate
      - name: Build app (simulator, unsigned)
        run: |
          cd ios
          xcodebuild -project Journal.xcodeproj -scheme Journal \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -20
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.0.app || sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Generate project
        run: brew install xcodegen && cd mac && cp Signing.xcconfig.example Signing.xcconfig && xcodegen generate
      - name: Build app (unsigned)
        run: |
          cd mac
          xcodebuild -project JournalMac.xcodeproj -scheme Journal \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO build | tail -20
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - name: JournalCore tests
        run: dotnet test windows/tests/JournalCore.Tests
      - name: Publish app (x64, ARM64)
        run: |
          dotnet publish windows/src/Journal.App -c Release -r win-x64 -o out/Journal-win-x64
          dotnet publish windows/src/Journal.App -c Release -r win-arm64 -o out/Journal-win-arm64
      - uses: actions/upload-artifact@v4
        with: { name: Journal-win-x64, path: out/Journal-win-x64 }
      - uses: actions/upload-artifact@v4
        with: { name: Journal-win-arm64, path: out/Journal-win-arm64 }
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - name: JournalCore tests
        run: cd android && ./gradlew :journalcore:test
      - name: Build app (debug APK, minified release)
        run: cd android && ./gradlew :app:assembleDebug :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with: { name: Journal-android-debug, path: android/app/build/outputs/apk/debug/app-debug.apk }
